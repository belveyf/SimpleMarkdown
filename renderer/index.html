<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>
<link id="katex-css" rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg:            #ffffff;
  --bg-soft:       #f6f8fa;
  --bg-float:      rgba(255,255,255,.86);
  --text:          #24292f;
  --text-soft:     #57606a;
  --accent:        #0a7cff;
  --accent-soft:   #e8f2ff;
  --border:        #d8dee4;
  --border-soft:   #eaeef2;
  --code-bg:       #f6f8fa;
  --quote-bar:     #bcd7ff;
  --quote-bg:      #f4f8ff;
  --shadow:        0 1px 3px rgba(31,35,40,.06), 0 8px 24px rgba(31,35,40,.06);
  --shadow-strong: 0 4px 16px rgba(31,35,40,.12), 0 16px 48px rgba(31,35,40,.10);
  --radius:        10px;
  --topbar-h:      52px;
  --grip-line:     #adb2b8;
  --scroll-thumb:  rgba(0,0,0,.20);
  --scroll-thumb-hover: rgba(0,0,0,.34);
}
html[data-theme="dark"] {
  --bg:            #0d1117;
  --bg-soft:       #161b22;
  --bg-float:      rgba(13,17,23,.86);
  --text:          #e6edf3;
  --text-soft:     #9198a1;
  --accent:        #58a6ff;
  --accent-soft:   #12263f;
  --border:        #30363d;
  --border-soft:   #21262d;
  --code-bg:       #161b22;
  --quote-bar:     #1f4f7d;
  --quote-bg:      #101c2b;
  --shadow:        0 1px 3px rgba(1,4,9,.5), 0 8px 24px rgba(1,4,9,.4);
  --shadow-strong: 0 4px 16px rgba(1,4,9,.6), 0 16px 48px rgba(1,4,9,.5);
  --grip-line:     #81858c;
  --scroll-thumb:  rgba(255,255,255,.20);
  --scroll-thumb-hover: rgba(255,255,255,.34);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============ 工具栏（可拖拽标题栏） ============ */
.topbar {
  position: relative; z-index: 50;
  flex: none;
  display: flex; align-items: center; gap: 10px;
  height: 52px;
  padding: 0 12px 0 92px;      /* 左侧留出 macOS 红绿灯位置 */
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border-soft);
  -webkit-app-region: drag;    /* 整条可拖动窗口 */
  user-select: none;
}
.topbar .brand {
  display: block;
  width: 24px; height: 24px;
  border-radius: 7px;
  object-fit: cover;
  flex: none;
  -webkit-user-drag: none;
}
/* ===== 标签栏 ===== */
.tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 62%;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  padding-right: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
  max-width: 210px;
  height: 30px;
  padding: 0 6px 0 11px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text-soft);
  font-size: 12.5px;
  font-family: inherit;
  line-height: 1;
  cursor: default;
  user-select: none;
  -webkit-app-region: no-drag;   /* 标签可点，但不算拖窗区 */
  transition: background-color .13s, color .13s, border-color .13s, box-shadow .13s;
}
.tab:hover { background: var(--border-soft); color: var(--text); }
.tab.active {
  background: var(--bg);   /* 比工具栏浅一档，形成「浮起」感 */
  border-color: var(--border);
  border-width: 1px;
  color: var(--text);
  font-weight: 600;
}
/* 活动标签底部一条强调线，位置一眼可见 */
html[data-theme="dark"] .tab.active {
  background: #22272e;
  border-color: #3d444d;
}
.tab.active::after {
  content: "";
  position: absolute;
  left: 9px; right: 9px; bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
  opacity: .9;
}

.tab-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-flex;
  align-items: baseline;
  gap: 1px;
}
.tab-ext {
  font-size: 11px;
  font-weight: 400;
  opacity: .55;
  flex: none;
}
/* 未保存提示点（非活动标签文件更新时出现） */
.tab-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
  margin-right: 2px;
}
/* 关闭按钮：悬停/活动时才显形 */
.tab-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px; height: 17px;
  flex: none;
  padding: 0;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: inherit;
  opacity: 0;
  cursor: pointer;
  transition: opacity .12s, background-color .12s;
}
.tab:hover .tab-close,
.tab.active .tab-close { opacity: .55; }
.tab-close:hover { opacity: 1 !important; background: var(--border); }
.tab-close svg {
  width: 9px; height: 9px;
  fill: none; stroke: currentColor;
  stroke-width: 2.2; stroke-linecap: round;
}
/* 拖动排序：被拖的标签变成"空槽"，其它标签自动让位（挤占效果） */
.tab.dragging {
  opacity: .5;
  background: transparent;
  border: 1px dashed var(--accent);
  color: transparent;          /* 只留一个空位轮廓 */
}
.tab.dragging .tab-close { display: none; }
/* 位移动画：让"挤开/让位"看起来是滑动而不是瞬跳 */
.tabs { transition: none; }
.tabs.reordering .tab { transition: none; }

/* 新建标签页按钮 */
.tab-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  flex: none;
  padding: 0;
  margin-left: 2px;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: var(--bg);
  color: var(--text-soft);
  cursor: pointer;
  -webkit-app-region: no-drag;
  transition: background-color .12s, color .12s, border-color .12s;
}
.tab-add:hover { background: var(--bg-soft); border-color: var(--border); color: var(--text); }
.tab-add svg {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round;
}
.topbar .spacer { flex: 1; }
.topbar .actions {
  display: flex; align-items: center; gap: 2px;
  -webkit-app-region: no-drag;  /* 按钮区域可点击 */
}
.tb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  padding: 0;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-soft);
  cursor: pointer;
  transition: background .14s ease, color .14s ease, border-color .14s ease, transform .1s ease;
}
.tb-btn:hover { background: var(--bg-soft); border-color: var(--border); color: var(--text); }
.tb-btn:active { transform: scale(.94); }
.tb-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb-btn svg {
  width: 17px; height: 17px;
  fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
.tb-sep {
  width: 1px; height: 16px;
  background: var(--border-soft);
  margin: 0 4px;
  flex: none;
}
/* 主题图标：亮色显示月亮、暗色显示太阳 */
#btn-theme .i-sun { display: none; }
html[data-theme="dark"] #btn-theme .i-sun { display: block; }
html[data-theme="dark"] #btn-theme .i-moon { display: none; }

.chip {
  font-size: 12px; padding: 2px 10px; border-radius: 20px;
  background: #fff3e6; color: #b25e09; border: 1px solid #ffd8a8;
}
html[data-theme="dark"] .chip { background: #2d1c0c; color: #f0a860; border-color: #5c3a14; }

/* ============ 布局 ============ */
:root { --main-left: var(--toc-w, 260px); }
html.toc-hidden { --main-left: 0px; }
.main { margin-left: var(--main-left); transition: margin-left .22s ease; }
html.toc-hidden .main { margin-left: 0; }
html.toc-resizing .main { transition: none; }
.wrap {
  position: relative;
  max-width: var(--wrap-w, 880px);
  margin: 0 auto;
  padding: 48px 32px 120px;
}
/* ============ 宽度调节（参考 DSH 分隔条：平时极细、悬停浮现渐隐线）============ */
#wrap-grip-left, #wrap-grip-right {
  position: fixed;
  top: var(--topbar-h, 52px);
  bottom: 0;
  width: 9px;                 /* 命中区（透明），靠两侧留白隐藏 */
  background: transparent;
  border: 0;
  padding: 0;
  cursor: col-resize;
  z-index: 45;
  touch-action: none;
}
#wrap-grip-left  { left: calc((100vw + var(--main-left) - var(--wrap-w, 880px)) / 2 - 4.5px); }
#wrap-grip-right { right: calc((100vw - var(--main-left) - var(--wrap-w, 880px)) / 2 - 4.5px); }

/* 悬停/拖动时浮现的竖线：两端渐隐，中间 1px 实线 */
#wrap-grip-left::after, #wrap-grip-right::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: linear-gradient(to bottom,
      transparent 0%,
      var(--grip-line) 22%,
      var(--grip-line) 78%,
      transparent 100%);
  opacity: 0;
  transition: opacity .16s ease-out;
  pointer-events: none;
}
#wrap-grip-left:hover::after, #wrap-grip-right:hover::after,
#wrap-grip-left.dragging::after, #wrap-grip-right.dragging::after { opacity: 1; }

html.wrap-dragging { cursor: col-resize; user-select: none; }
html.wrap-dragging #viewer { pointer-events: none; }
html.wrap-dragging #wrap-grip-left::after, html.wrap-dragging #wrap-grip-right::after { opacity: 1; }
#viewer h1:first-child { margin-top: 0; }

/* 内容滚动区（滚动条从工具栏下方开始，不顶到顶部） */
.scroll-area {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ============ 正文排版 ============ */
#viewer {
  font-size: 16px;
  line-height: 1.85;
  word-wrap: break-word;
}
#viewer > *:first-child { margin-top: 0; }
#viewer p { margin: 1.05em 0; }
#viewer h1, #viewer h2, #viewer h3, #viewer h4, #viewer h5, #viewer h6 {
  margin: 1.6em 0 .7em;
  font-weight: 650;
  line-height: 1.35;
  scroll-margin-top: 72px;
}
#viewer h1 {
  font-size: 1.9em;
  padding-bottom: .35em;
  border-bottom: 1px solid var(--border-soft);
}
#viewer h2 {
  font-size: 1.5em;
  padding-bottom: .3em;
  border-bottom: 1px solid var(--border-soft);
}
#viewer h3  { font-size: 1.25em; }
#viewer h4  { font-size: 1.08em; }
#viewer h5, #viewer h6 { font-size: 1em; color: var(--text-soft); }
#viewer a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
#viewer a:hover { border-bottom-color: var(--accent); }
#viewer strong { font-weight: 650; }
/* 正文里 ==高亮== 语法（与搜索命中区分开） */
#viewer mark:not(.md-hit) {
  background: linear-gradient(transparent 55%, #fff176 55%);
  padding: 0 2px;
}
html[data-theme="dark"] #viewer mark:not(.md-hit) {
  background: linear-gradient(transparent 55%, #665c00 55%);
  color: #f0f3f6;
}

/* 列表 */
#viewer ul, #viewer ol { padding-left: 1.6em; margin: 1em 0; }
#viewer li { margin: .3em 0; }
#viewer li::marker { color: var(--text-soft); }
#viewer ul.contains-task-list { list-style: none; padding-left: .3em; }
#viewer .task-list-item { list-style: none; }
#viewer .task-list-item-checkbox {
  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px; margin: 0 8px 0 -1.4em;
  vertical-align: -2.5px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  position: relative;
  cursor: default;
}
#viewer .task-list-item-checkbox:checked {
  background: var(--accent); border-color: var(--accent);
}
#viewer .task-list-item-checkbox:checked::after {
  content: "";
  position: absolute; left: 4.5px; top: 1px;
  width: 4px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* 引用 */
#viewer blockquote {
  margin: 1.2em 0;
  padding: .7em 1.1em;
  border-left: 4px solid var(--quote-bar);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--quote-bg);
  color: var(--text-soft);
}
#viewer blockquote p { margin: .45em 0; }
#viewer blockquote > :first-child { margin-top: 0; }
#viewer blockquote > :last-child { margin-bottom: 0; }

/* 分割线 */
#viewer hr {
  border: none;
  height: 1px;
  margin: 2.4em 0;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

/* 图片 */
#viewer img {
  max-width: 100%;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin: .4em 0;
}
#viewer figure { margin: 1.4em 0; text-align: center; }
#viewer figcaption { font-size: .86em; color: var(--text-soft); margin-top: .6em; }

/* 表格 */
#viewer .table-wrap {
  margin: 1.4em 0;
  overflow-x: auto;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#viewer table {
  border-collapse: collapse;
  width: 100%;
  font-size: .94em;
  line-height: 1.6;
}
#viewer th, #viewer td {
  padding: .6em 1em;
  border-bottom: 1px solid var(--border-soft);
  text-align: left;
}
#viewer thead th {
  background: var(--bg-soft);
  font-weight: 620;
  color: var(--text-soft);
  font-size: .92em;
  letter-spacing: .2px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
#viewer tbody tr:last-child td { border-bottom: none; }
#viewer tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--bg-soft) 45%, transparent); }
#viewer tbody tr:hover td { background: var(--accent-soft); }

/* 行内代码 */
#viewer code {
  font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .875em;
}
#viewer :not(pre) > code {
  background: var(--code-bg);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: .15em .45em;
  color: #b35900;
}
html[data-theme="dark"] #viewer :not(pre) > code { color: #ffab70; }

/* 代码块 */
#viewer pre {
  position: relative;
  margin: 1.4em 0;
  padding: 1em 1.2em;
  background: var(--code-bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow-x: auto;
  line-height: 1.65;
  box-shadow: var(--shadow);
}
#viewer pre code {
  background: none; border: none; padding: 0;
  font-size: .875em;
  display: block;
  color: var(--text);
}

/* ---- 语法高亮配色（亮色） ---- */
.hljs-comment, .hljs-quote { color: #6a737d; font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-formula { color: #d73a49; }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta-string { color: #032f62; }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link, .hljs-meta, .hljs-selector-id, .hljs-title { color: #005cc5; }
.hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-title.function_ { color: #6f42c1; }
.hljs-attr, .hljs-variable, .hljs-template-variable, .hljs-type, .hljs-selector-attr,
.hljs-selector-pseudo, .hljs-params, .hljs-built_in, .hljs-name { color: #e36209; }
.hljs-tag { color: #22863a; }
.hljs-section, .hljs-selector-class { color: #6f42c1; font-weight: 600; }
.hljs-deletion { color: #b31d28; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* ---- 语法高亮配色（暗色） ---- */
html[data-theme="dark"] .hljs-comment, html[data-theme="dark"] .hljs-quote { color: #8b949e; }
html[data-theme="dark"] .hljs-keyword, html[data-theme="dark"] .hljs-selector-tag,
html[data-theme="dark"] .hljs-literal, html[data-theme="dark"] .hljs-doctag,
html[data-theme="dark"] .hljs-formula { color: #ff7b72; }
html[data-theme="dark"] .hljs-string, html[data-theme="dark"] .hljs-regexp,
html[data-theme="dark"] .hljs-addition, html[data-theme="dark"] .hljs-attribute,
html[data-theme="dark"] .hljs-meta-string { color: #a5d6ff; }
html[data-theme="dark"] .hljs-number, html[data-theme="dark"] .hljs-symbol,
html[data-theme="dark"] .hljs-bullet, html[data-theme="dark"] .hljs-link,
html[data-theme="dark"] .hljs-meta, html[data-theme="dark"] .hljs-selector-id,
html[data-theme="dark"] .hljs-title { color: #79c0ff; }
html[data-theme="dark"] .hljs-title, html[data-theme="dark"] .hljs-title.class_,
html[data-theme="dark"] .hljs-title.class_.inherited__, html[data-theme="dark"] .hljs-title.function_ { color: #d2a8ff; }
html[data-theme="dark"] .hljs-attr, html[data-theme="dark"] .hljs-variable,
html[data-theme="dark"] .hljs-template-variable, html[data-theme="dark"] .hljs-type,
html[data-theme="dark"] .hljs-selector-attr, html[data-theme="dark"] .hljs-selector-pseudo,
html[data-theme="dark"] .hljs-params, html[data-theme="dark"] .hljs-built_in,
html[data-theme="dark"] .hljs-name { color: #ffa657; }
html[data-theme="dark"] .hljs-tag { color: #7ee787; }
html[data-theme="dark"] .hljs-section, html[data-theme="dark"] .hljs-selector-class { color: #d2a8ff; }
html[data-theme="dark"] .hljs-deletion { color: #ffdcd7; }
.copy-btn {
  position: absolute; top: 8px; right: 8px;
  font-size: 12px; padding: 3px 10px;
  color: var(--text-soft);
  background: var(--bg-float);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
  font-family: inherit;
}
#viewer pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }

/* mermaid 图 */
#viewer .mermaid {
  margin: 1.6em 0;
  padding: 1.4em;
  text-align: center;
  background: var(--bg-soft);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#viewer .mermaid svg { max-width: 100%; height: auto; }

/* KaTeX */
#viewer .katex-display { margin: 1.2em 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

/* 目录侧栏（左侧，默认展开） */
#toc {
  position: fixed; top: var(--topbar-h, 52px); left: 0; bottom: 0;
  width: var(--toc-w, 260px);
  background: var(--bg);
  border-right: 1px solid var(--border-soft);
  box-shadow: 8px 0 32px rgba(31,35,40,.06);
  overflow-y: auto;
  padding: 18px 16px 40px;
  transform: translateX(0);
  transition: transform .22s ease;
  z-index: 40;
}
html.toc-hidden #toc { transform: translateX(-105%); box-shadow: none; }
/* 目录宽度调节：同样走 DSH 风格（常显极细分界线 + 悬停浮现渐隐线） */
#toc-resizer {
  position: fixed;
  top: var(--topbar-h, 52px);
  bottom: 0;
  left: calc(var(--toc-w, 260px) - 4.5px);
  width: 9px;
  cursor: col-resize;
  z-index: 46;
  touch-action: none;
  background: transparent;
}
/* 常显：极淡的 0.5px 分界线 */
#toc-resizer::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: var(--border-soft);
  pointer-events: none;
}
/* 悬停/拖动：渐隐实线盖上去 */
#toc-resizer::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: linear-gradient(to bottom,
      transparent 0%,
      var(--grip-line) 22%,
      var(--grip-line) 78%,
      transparent 100%);
  opacity: 0;
  transition: opacity .16s ease-out;
  pointer-events: none;
}
#toc-resizer:hover::after, #toc-resizer.dragging::after { opacity: 1; }
html.toc-hidden #toc-resizer { display: none; }
html.toc-resizing { cursor: col-resize; user-select: none; }
html.toc-resizing #toc-resizer::after { opacity: 1; }
#toc .toc-title {
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-soft); text-transform: uppercase;
  margin-bottom: 12px;
}
#toc a {
  display: block;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-soft);
  text-decoration: none;
  padding: 4px 10px;
  border-left: 2px solid transparent;
  border-radius: 0 6px 6px 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#toc a:hover { color: var(--text); background: var(--bg-soft); }
#toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 550; }
#toc a.lvl-2 { padding-left: 26px; }
#toc a.lvl-3 { padding-left: 42px; font-size: 13px; }

/* ============ 空状态 / 拖放 ============ */
#empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 65vh; text-align: center;
}
#empty[hidden] { display: none; }
#empty .icon {
  width: 92px; height: 92px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft);
  border-radius: 26px;
  margin-bottom: 26px;
}
#empty .icon svg { width: 46px; height: 46px; stroke: var(--accent); }
#empty h2 { font-size: 22px; margin: 0 0 10px; font-weight: 650; }
#empty p { color: var(--text-soft); font-size: 14.5px; margin: 4px 0; }
#empty .kbd {
  display: inline-block;
  font-size: 12px; font-family: ui-monospace, monospace;
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--bg-soft);
}

#drop-overlay {
  position: fixed; inset: 0; z-index: 999;
  display: none;
  align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  backdrop-filter: blur(4px);
  font-size: 26px; font-weight: 650; color: var(--accent);
  border: 3px dashed var(--accent);
  pointer-events: none;
}
body.dragging #drop-overlay { display: flex; }

/* ============ 页面内查找 ============ */
#findbar {
  position: fixed;
  top: calc(var(--topbar-h, 52px) + 12px);
  right: 24px;
  z-index: 60;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border-radius: 11px;
  background: var(--bg-float);
  backdrop-filter: saturate(1.8) blur(18px);
  -webkit-backdrop-filter: saturate(1.8) blur(18px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-strong);
  font-size: 13px;
}
#findbar.open { display: flex; }
#find-input {
  width: 210px;
  padding: 5px 9px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
}
#find-input:focus { border-color: var(--accent); }
#find-count {
  min-width: 66px;
  text-align: right;
  font-size: 12px;
  color: var(--text-soft);
  font-variant-numeric: tabular-nums;
}
.find-nav {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px;
  padding: 0;
  border: none; border-radius: 7px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
}
.find-nav:hover { background: var(--bg-soft); color: var(--text); }
.find-nav:disabled { opacity: .35; cursor: default; }
.find-nav svg {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor;
  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}
/* 命中高亮 */
/* ===== 搜索命中高亮 ===== */
/* 非当前命中：淡琥珀底，文字颜色不动，保证可读 */

  background: rgba(255, 197, 20, .34);

  border-radius: 2px;
  padding: 0 1px;
}
/* 当前命中：实心橙 + 深色字，一眼能找到，且不刺眼 */

  background: #ff9f1a;
  color: #21160a;
  box-shadow: 0 0 0 1.5px rgba(255, 159, 26, .45);

  background: rgba(255, 197, 20, .26);

}

  color: #1a1205;

  flex: 1;

<script>
/* 嵌入内容（命令行打开时注入） */
/*__MDVIEW_EMBED__*/null
/* 服务模式配置（本地服务打开时注入），形如 { url: "/raw", name: "xxx.md" } */
/*__MDVIEW_LIVE__*/null
/* 文件模式配置（无服务时注入），形如 { name: "xxx.md", key: "<路径哈希>" } */
/*__MDVIEW_FILE__*/null
</script>

<script>
"use strict";

/* ================= 库加载（全部本地，无需联网） ================= */
let md = null;        // markdown-it 实例
let hljsMod = null;   // highlight.js
let katexReady = false;
const missing = new Set();

async function loadLibs() {
  if (window.markdownit) {
    md = window.markdownit();
  } else {
    missing.add("markdown-it");
  }
  if (window.hljs) {
    hljsMod = window.hljs;
  } else {
    missing.add("代码高亮");
  }
  if (window.katex && window.renderMathInElement) {
    katexReady = true;
  } else {
    missing.add("数学公式");
  }
  if (window.mermaid) {
    window.mermaid.initialize({
      startOnLoad: false,
      theme: document.documentElement.dataset.theme === "dark" ? "dark" : "neutral",
      securityLevel: "loose",
      fontFamily: "inherit",
    });
  } else {
    missing.add("Mermaid 图表");
  }
  if (missing.size) {
    console.warn("未加载:", [...missing].join("、"));
  }
}

/* ================= task-list 小插件 ================= */
function taskListsPlugin(parser) {
  parser.core.ruler.push("task_lists", (state) => {
    const tokens = state.tokens;
    const stack = [];
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];
      if (t.type === "list_item_open") { stack.push(i); continue; }
      if (t.type === "list_item_close") { stack.pop(); continue; }
      if (t.type !== "inline" || stack.length === 0) continue;
      const m = /^\[([ xX])\]\s+/.exec(t.content);
      if (!m) continue;
      const li = stack[stack.length - 1];
      if (tokens[li + 1]?.type !== "paragraph_open" || tokens[li + 2] !== t) continue;
      const checked = m[1] !== " ";
      const cb = new state.Token("html_inline", "", 0);
      cb.content = `<input class="task-list-item-checkbox" type="checkbox" disabled${checked ? " checked" : ""}>`;
      t.content = t.content.slice(m[0].length);
      if (t.children?.length && t.children[0].type === "text") {
        if (t.children[0].content.startsWith(m[0]))
          t.children[0].content = t.children[0].content.slice(m[0].length);
      }
      t.children.unshift(cb);
      tokens[li].attrJoin("class", "task-list-item");
      // 给外层 ul 加 contains-task-list
      for (let j = li; j >= 0; j--) {
        if (tokens[j].type === "bullet_list_open" || tokens[j].type === "ordered_list_open") {
          tokens[j].attrJoin("class", "contains-task-list");
          break;
        }
      }
    }
  });
}

/* ================= 渲染 ================= */
const viewer = document.getElementById("viewer");
const empty  = document.getElementById("empty");

/* 内容区滚动容器（工具栏下方独立滚动，滚动条不会顶到顶部） */
const scroller = () => document.getElementById("scroll-area");
function scrollToTop() {
  const sc = scroller();
  if (sc) sc.scrollTop = 0;
  else window.scrollTo(0, 0);
}
function currentScrollTop() {
  const sc = scroller();
  return sc ? sc.scrollTop : window.scrollY;
}

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

async function renderMarkdown(text, name, opts) {
  if (!md) { viewer.innerHTML = `<pre>${escHtml(text)}</pre>`; return; }

  md.set({ html: true, linkify: true, typographer: true, breaks: false });
  if (!md.options._taskLists) { md.use(taskListsPlugin); md.options._taskLists = true; }

  let html;
  try { html = md.render(text); }
  catch (e) { viewer.innerHTML = `<pre>渲染出错：${escHtml(String(e))}</pre>`; return; }

  const prevScrollTop = currentScrollTop();   // 刷新前的位置
  viewer.innerHTML = html;
  empty.hidden = true;
  viewer.hidden = false;
  document.title = (name || "Markdown") + " — Simple Markdown";

  postProcess();
  buildToc();
  try { findAfterRender(); } catch (e) {}
  if (opts && opts.keepScroll) {
    // 自动刷新时保持阅读位置
    const sc = scroller();
    if (sc) sc.scrollTop = prevScrollTop;
  } else {
    scrollToTop();
  }
}

function postProcess() {
  /* --- 表格包裹（横向滚动） --- */
  viewer.querySelectorAll("table").forEach((tbl) => {
    if (tbl.parentElement?.classList.contains("table-wrap")) return;
    const w = document.createElement("div");
    w.className = "table-wrap";
    tbl.parentNode.insertBefore(w, tbl);
    w.appendChild(tbl);
  });

  /* --- 代码块：mermaid 转图 / 高亮 / 复制按钮 --- */
  const mermaidNodes = [];
  viewer.querySelectorAll("pre code").forEach((block) => {
    const lang = [...block.classList].find(c => c.startsWith("language-"))?.slice(9) || "";
    if (lang === "mermaid") {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = block.textContent;
      block.parentElement.replaceWith(div);
      mermaidNodes.push(div);
      return;
    }
    if (hljsMod) { try { hljsMod.highlightElement(block); } catch (e) {} }
    const pre = block.parentElement;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "复制";
    btn.onclick = async () => {
      await navigator.clipboard.writeText(block.textContent);
      btn.textContent = "已复制 ✓";
      setTimeout(() => (btn.textContent = "复制"), 1400);
    };
    pre.appendChild(btn);
  });

  if (mermaidNodes.length && window.mermaid) {
    mermaid.run({ nodes: mermaidNodes }).catch(() => {});
  }

  /* --- 公式 --- */
  if (katexReady) {
    try {
      window.renderMathInElement(viewer, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false },
        ],
        throwOnError: false,
        ignoredClasses: ["mermaid"],
      });
    } catch (e) {}
  }
}

/* ================= 页面内查找 ================= */
const FIND_SKIP_SELECTOR = ".katex, .mermaid, script, style, mark.md-hit";
const findState = { query: "", hits: [], index: -1 };

function findEls() {
  return {
    bar: document.getElementById("findbar"),
    input: document.getElementById("find-input"),
    count: document.getElementById("find-count"),
    prev: document.getElementById("find-prev"),
    next: document.getElementById("find-next"),
  };
}

function findIsOpen() {
  const { bar } = findEls();
  return !!(bar && bar.classList.contains("open"));
}

/** 把之前的 <mark> 还原成纯文本（不动其它 DOM） */
function clearFindHighlights() {
  const root = document.getElementById("viewer");
  if (!root) return;
  const marks = root.querySelectorAll("mark.md-hit");
  if (!marks.length) return;
  const parents = new Set();
  marks.forEach((m) => {
    const parent = m.parentNode;
    if (!parent) return;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
    parents.add(parent);
  });
  parents.forEach((p) => { try { p.normalize(); } catch (e) {} });
}

/** 按文本节点逐个匹配并包裹高亮；返回所有 mark 元素 */
function collectFindHits(query) {
  clearFindHighlights();
  const root = document.getElementById("viewer");
  if (!root || !query) return [];

  const lower = query.toLowerCase();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (parent.closest(FIND_SKIP_SELECTOR)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });

  const textNodes = [];
  let n;
  while ((n = walker.nextNode())) textNodes.push(n);

  const hits = [];
  for (const node of textNodes) {
    const text = node.nodeValue;
    const haystack = text.toLowerCase();
    let from = 0;
    let idx = haystack.indexOf(lower, from);
    if (idx === -1) continue;

    const frag = document.createDocumentFragment();
    let last = 0;
    while (idx !== -1) {
      if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const mark = document.createElement("mark");
      mark.className = "md-hit";
      mark.textContent = text.slice(idx, idx + query.length);
      frag.appendChild(mark);
      hits.push(mark);
      last = idx + query.length;
      idx = haystack.indexOf(lower, last);
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  return hits;
}

function updateFindUI(scrollToCurrent) {
  const { count, prev, next } = findEls();
  const total = findState.hits.length;
  if (!findState.query) {
    if (count) count.textContent = "";
  } else if (!total) {
    if (count) count.textContent = "无结果";
  } else {
    if (count) count.textContent = `${findState.index + 1} / ${total}`;
  }
  const hasHits = total > 0;
  if (prev) prev.disabled = !hasHits;
  if (next) next.disabled = !hasHits;

  findState.hits.forEach((m, i) => m.classList.toggle("current", i === findState.index));
  if (scrollToCurrent && findState.index >= 0 && findState.hits[findState.index]) {
    findState.hits[findState.index].scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

/** 当前视口位置之后（含）的第一个命中 */
function firstHitFromViewport(hits) {
  if (!hits.length) return -1;
  const sc = scroller();
  const topEdge = sc ? sc.getBoundingClientRect().top : 0;
  for (let i = 0; i < hits.length; i++) {
    const r = hits[i].getBoundingClientRect();
    if (r.bottom >= topEdge) return i;   // 还在视口内或更靠下
  }
  return 0;   // 都在上方 → 从头开始（等价环绕）
}

/**
 * 执行搜索
 *   opts.fromCurrent  true（默认）= 从当前阅读位置往后找，不要跳回文档开头
 *   opts.scroll       true（默认）= 滚动到当前命中
 */
function findRun(opts) {
  const { input } = findEls();
  const fromCurrent = !opts || opts.fromCurrent !== false;
  const doScroll = !opts || opts.scroll !== false;

  findState.query = input ? input.value : "";
  findState.hits = collectFindHits(findState.query);

  if (!findState.hits.length) {
    findState.index = -1;
  } else if (fromCurrent) {
    findState.index = firstHitFromViewport(findState.hits);
  } else {
    findState.index = Math.min(Math.max(findState.index, 0), findState.hits.length - 1);
  }
  updateFindUI(doScroll);
}

/** 重新计算命中但保持当前位置（用于重开搜索框 / 文档刷新） */
function findRefresh() {
  const { input } = findEls();
  const q = input ? input.value : "";
  if (!q) return;
  findState.query = q;
  findState.hits = collectFindHits(q);
  if (!findState.hits.length) {
    findState.index = -1;
  } else if (findState.index < 0) {
    findState.index = firstHitFromViewport(findState.hits);
  } else if (findState.index >= findState.hits.length) {
    findState.index = findState.hits.length - 1;
  }
  updateFindUI(false);   // 关键：不滚动
}

function findStep(dir) {
  const total = findState.hits.length;
  if (!total) return;
  findState.index = (findState.index + dir + total) % total;
  updateFindUI(true);
}

function openFind() {
  const { bar, input } = findEls();
  if (!bar || !input) return;
  // 有选中文本时带入搜索框（不跨行）
  try {
    const sel = String(getSelection() || "").trim();
    if (sel && !sel.includes("\n") && sel.length <= 120) input.value = sel;
  } catch (e) {}
  bar.classList.add("open");
  input.focus();
  input.select();
  // 重开时只恢复上次的关键词与高亮，不移动视图
  if (input.value) findRefresh();
}

function closeFind() {
  const { bar, count } = findEls();
  if (bar) bar.classList.remove("open");
  clearFindHighlights();
  findState.query = "";
  findState.hits = [];
  findState.index = -1;
  if (count) count.textContent = "";
}

/** 文档重新渲染后（例如文件自动刷新），把查找结果恢复出来 */
function findAfterRender() {
  if (!findIsOpen()) return;
  const { input } = findEls();
  if (input && input.value) findRefresh();
}

function bindFindEvents() {
  const { input, prev, next, bar } = findEls();
  if (!bar || bar.dataset.bound === "1") return;
  bar.dataset.bound = "1";

  input.addEventListener("input", () => findRun({ fromCurrent: true }));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      findStep(e.shiftKey ? -1 : 1);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeFind();
    }
  });
  if (prev) prev.onclick = () => findStep(-1);
  if (next) next.onclick = () => findStep(1);
  const closeBtn = document.getElementById("find-close");
  if (closeBtn) closeBtn.onclick = () => closeFind();

  // 全局快捷键：⌘F 打开；⌘G / ⇧⌘G 上下跳；Esc 关闭
  document.addEventListener("keydown", (e) => {
    const meta = e.metaKey || e.ctrlKey;
    const key = (e.key || "").toLowerCase();
    if (meta && key === "f") { e.preventDefault(); openFind(); return; }
    if (meta && key === "g") { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); return; }
    if (e.key === "Escape" && findIsOpen()) { e.preventDefault(); closeFind(); }
  });
}

let tocLinks = [];
function buildToc() {
  const body = document.getElementById("toc-body");
  body.innerHTML = "";
  tocLinks = [];
  const heads = viewer.querySelectorAll("h1, h2, h3");
  const used = new Set();
  heads.forEach((h) => {
    let id = h.textContent.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-+|-+$/g, "") || "sec";
    let uniq = id, n = 2;
    while (used.has(uniq)) uniq = id + "-" + n++;
    used.add(uniq);
    h.id = uniq;
    const a = document.createElement("a");
    a.href = "#" + uniq;
    a.textContent = h.textContent;
    a.className = "lvl-" + h.tagName[1];
    body.appendChild(a);
    tocLinks.push({ a, h });
  });
  spyUpdate();
}

let spyTimer = null;
function spyUpdate() {
  if (!tocLinks.length) return;
  // 关键：标题用 scroll-margin-top 定位（相对内容区），
  // 判定线也必须相对内容区，否则会被工具栏高度「偷掉」一截，
  // 表现为点 1.2 却高亮成 1.1。
  const sc = scroller();
  const baseTop = sc ? sc.getBoundingClientRect().top : 0;
  const threshold = baseTop + 80; // 略大于 scroll-margin-top(72px)，保证点中的章节算“当前”
  let cur = tocLinks[0];
  for (const l of tocLinks) {
    if (l.h.getBoundingClientRect().top <= threshold) cur = l;
  }
  tocLinks.forEach(l => l.a.classList.toggle("active", l === cur));
  if (cur && !document.documentElement.classList.contains("toc-hidden")) {
    const r = cur.a.getBoundingClientRect();
    if (r.top < 60 || r.bottom > window.innerHeight - 20)
      cur.a.scrollIntoView({ block: "nearest" });
  }
}
/* 滚动监听挂到内容区；滚动时让滚动条短暂显形 */

let dragDepth = 0;
/* 标签拖动时（window.__mdTabDrag），全局「拖文件进来」提示必须完全不参与 */
function isTabDragging() { return window.__mdTabDrag === true; }
window.addEventListener("dragenter", (e) => {
  if (isTabDragging()) return;
  e.preventDefault(); dragDepth++; document.body.classList.add("dragging");
});
window.addEventListener("dragover",  (e) => { if (!isTabDragging()) e.preventDefault(); });
window.addEventListener("dragleave", () => {
  if (isTabDragging()) { dragDepth = 0; document.body.classList.remove("dragging"); return; }
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); }
});
window.addEventListener("drop", (e) => {
  if (isTabDragging()) { dragDepth = 0; document.body.classList.remove("dragging"); return; }
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  if (e.dataTransfer && e.dataTransfer.files.length) openFiles(e.dataTransfer.files);
});
/* 兜底：任何拖动结束都清掉提示层，避免遮罩卡住 */
document.addEventListener("dragend", () => { window.__mdTabDrag = false; dragDepth = 0; document.body.classList.remove("dragging"); }, true);

/* 粘贴文本
   ⚠️ 焦点在输入框 / 可编辑区域时（例如查找框），必须放行给浏览器默认行为：
   否则 Cmd+V 会被这里拦掉，输入框收不到文字，反而把正文换成剪贴板内容。 */
function pasteIntoEditable(e) {
  const t = e.target;
  return !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable));
}
window.addEventListener("paste", (e) => {
  if (pasteIntoEditable(e)) return;
  const txt = e.clipboardData?.getData("text/plain");
  if (txt && txt.trim() && !e.clipboardData.files.length) {
    e.preventDefault();
    renderMarkdown(txt, "粘贴的内容");
  }
});

/* ================= 布局拖动：目录宽度 + 正文位置 ================= */
(function initLayoutDrag() {
  const root = document.documentElement;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : parseFloat(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  };
  const CLAMP = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /* --- 目录宽度拖动 --- */
  let tocW = CLAMP(store.get("smd-toc-w", 260), 180, 560);
  root.style.setProperty("--toc-w", tocW + "px");

  const resizer = document.getElementById("toc-resizer");
  let rz = null; // { startX, startW }
  resizer.addEventListener("pointerdown", (e) => {
    rz = { startX: e.clientX, startW: tocW };
    try { resizer.setPointerCapture(e.pointerId); } catch (err) {}
    resizer.classList.add("dragging");
    root.classList.add("toc-resizing");
    e.preventDefault();
  });
  // 挂 window 级监听：即使指针捕获失效（元素随宽度移动），事件也能收到
  window.addEventListener("pointermove", (e) => {
    if (!rz) return;
    tocW = CLAMP(rz.startW + (e.clientX - rz.startX), 180, 560);
    root.style.setProperty("--toc-w", tocW + "px");
  });
  const endRz = () => {
    if (!rz) return;
    rz = null;
    resizer.classList.remove("dragging");
    root.classList.remove("toc-resizing");
    store.set("smd-toc-w", tocW);
  };
  window.addEventListener("pointerup", endRz);
  window.addEventListener("pointercancel", endRz);

  /* --- 正文宽度拖动（左右对称联动，拖任意一边对侧同步镜像） --- */
  const wrap = document.querySelector(".wrap");
  const gripL = document.getElementById("wrap-grip-left");
  const gripR = document.getElementById("wrap-grip-right");
  const MIN_W = 380;
  const mainLeftOf = () => root.classList.contains("toc-hidden") ? 0 : tocW;

  let wrapW = CLAMP(store.get("smd-wrap-w", 880), MIN_W, 2000);
  try { localStorage.removeItem("smd-wrap-shift"); } catch (e) {}
  root.style.setProperty("--wrap-w", wrapW + "px");

  let gd = null; // { side: "l"|"r", startX, startW }
  const beginGd = (side, e) => {
    gd = { side, startX: e.clientX, startW: wrapW };
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    e.target.classList.add("dragging");
    root.classList.add("wrap-dragging");
    e.preventDefault();
  };
  gripL.addEventListener("pointerdown", (e) => beginGd("l", e));
  gripR.addEventListener("pointerdown", (e) => beginGd("r", e));

  window.addEventListener("pointermove", (e) => {
    if (!gd) return;
    const mainLeft = mainLeftOf();
    const dx = e.clientX - gd.startX;
    // 对称联动：拖左柄右移 = 左缘右移、右缘左移（宽度减 2*dx）；拖右柄相反
    let w = gd.side === "l" ? gd.startW - 2 * dx : gd.startW + 2 * dx;
    const maxW = Math.max(MIN_W, window.innerWidth - mainLeft - 20);
    wrapW = CLAMP(w, MIN_W, maxW);
    root.style.setProperty("--wrap-w", wrapW + "px");
  });
  const endGd = () => {
    if (!gd) return;
    gd = null;
    gripL.classList.remove("dragging");
    gripR.classList.remove("dragging");
    root.classList.remove("wrap-dragging");
    store.set("smd-wrap-w", wrapW);
  };
  window.addEventListener("pointerup", endGd);
  window.addEventListener("pointercancel", endGd);

  /* 双击手柄：恢复默认宽度 */
  const resetGd = () => {
    wrapW = 880;
    root.style.setProperty("--wrap-w", wrapW + "px");
    store.set("smd-wrap-w", wrapW);
  };
  gripL.addEventListener("dblclick", resetGd);
  gripR.addEventListener("dblclick", resetGd);

  /* 窗口变化时保持宽度不越界 */
  window.addEventListener("resize", () => {
    const mainLeft = mainLeftOf();
    const maxW = Math.max(MIN_W, window.innerWidth - mainLeft - 20);
    wrapW = CLAMP(wrapW, MIN_W, maxW);
    root.style.setProperty("--wrap-w", wrapW + "px");
  });
})();

const APP = window.smdApp || null;

/* ================= 标签栏（桌面版） ================= */
const tabsEl = document.getElementById("tabs");
const tabScrollMemory = new Map();   // 文档 id -> 上次滚动位置
let tabActiveId = null;

function renderTabs(tabs, activeId) {
  if (!tabsEl) return;
  lastTabsPayload = { tabs, activeId };
  hideTabTip();
  tabTipElNow = null;
  // 切换前保存当前文档的滚动位置
  if (tabActiveId !== null) tabScrollMemory.set(tabActiveId, currentScrollTop());

  tabsEl.innerHTML = "";
  for (const t of tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeId ? " active" : "");
    // 不用原生 title（延迟长、显示的是长路径），改用自定义提示
    el.dataset.id = String(t.id);
    el.draggable = true;
    bindTabDrag(el);

    const name = document.createElement("span");
    name.className = "tab-name";
    const dot = t.name.lastIndexOf(".");
    if (dot > 0 && t.name.length - dot <= 8) {
      const base = document.createElement("span");
      base.textContent = t.name.slice(0, dot);
      const ext = document.createElement("span");
      ext.className = "tab-ext";
      ext.textContent = t.name.slice(dot);
      name.append(base, ext);
    } else {
      name.textContent = t.name;
    }
    el.appendChild(name);

    if (t.dirty && t.id !== activeId) {
      const dot = document.createElement("span");
      dot.className = "tab-dot";
      dot.title = "文件已更新";
      el.appendChild(dot);
    }

    const close = document.createElement("button");
    close.className = "tab-close";
    close.title = "关闭标签页（⌘W）";
    close.innerHTML = '<svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';
    close.onclick = (e) => { e.stopPropagation(); APP.closeTab(t.id); };
    el.appendChild(close);

    el.onclick = () => { if (t.id !== tabActiveId) APP.activateTab(t.id); };
    el.onauxclick = (e) => { if (e.button === 1) APP.closeTab(t.id); };  // 中键关闭
    tabsEl.appendChild(el);
  }

  tabActiveId = activeId;
  bindTabsAreaDrop();
  bindTabTipDelegation();

  // 活动标签滚入可视区
  const act = tabsEl.querySelector(".tab.active");
  if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ================= 标签拖动排序（拖动时实时挤占让位） ================= */
/* ===== 标签悬停提示（容器事件委托 + 即时显示） =====
   两个坑：
   1) 标签列表每次变化整块重建 DOM，按元素挂监听会被旧元素迟到的 mouseleave 干扰，
      导致「新加的标签悬停没反应」——所以在容器上做委托。
   2) 早期用 setTimeout 延迟弹出，窗口不在前台时定时器被浏览器节流，
      表现为有时不弹、有时弹上一个标签的内容——改成立即显示，不依赖定时器。 */
let tabTipElNow = null;      // 当前悬停的标签元素

function hideTabTip() {
  tabTipElNow = null;
  const tip = document.getElementById("tab-tip");
  if (tip) tip.classList.remove("show");
}

function showTabTip(tabEl, name, fullPath) {
  const tip = document.getElementById("tab-tip");
  if (!tip || !tabEl || !document.body.contains(tabEl)) return;

  tip.innerHTML = "";
  const n = document.createElement("div");
  n.className = "tip-name";
  n.textContent = name;
  tip.appendChild(n);
  if (fullPath) {
    const p = document.createElement("div");
    p.className = "tip-path";
    p.textContent = fullPath;
    tip.appendChild(p);
  }
  tip.classList.add("show");

  // 定位在标签下方；贴右边界时向左收，下方放不下就翻到上面
  const r = tabEl.getBoundingClientRect();
  const tw = tip.offsetWidth;
  const th = tip.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - tw - 8);
  left = Math.max(8, left);
  let top = r.bottom + 6;
  if (top + th > window.innerHeight - 8) top = r.top - th - 6;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

/** 指针落在某个标签上：显示完整文件名与路径（不论是否被截断） */
function handleTabPointer(tabEl) {
  if (dragTabId !== null) { hideTabTip(); return; }
  if (tabEl === tabTipElNow) return;          // 同一个标签，保持现状

  const nameEl = tabEl.querySelector(".tab-name");
  if (!nameEl) { hideTabTip(); return; }

  tabTipElNow = tabEl;
  const id = Number(tabEl.dataset.id);
  const info = ((lastTabsPayload && lastTabsPayload.tabs) || []).find((t) => t.id === id);
  const name = info ? info.name : nameEl.textContent;
  const fullPath = info ? info.path : "";
  showTabTip(tabEl, name, fullPath);
}

let tabTipBound = false;
function bindTabTipDelegation() {
  if (!tabsEl || tabTipBound) return;
  tabTipBound = true;

  // 用 mousemove 而不是 mouseover：标签在静止的指针下方新建时也能立刻响应
  tabsEl.addEventListener("mousemove", (e) => {
    const tab = e.target && e.target.closest ? e.target.closest(".tab") : null;
    if (!tab) { hideTabTip(); return; }
    handleTabPointer(tab);
  });

  tabsEl.addEventListener("mouseleave", hideTabTip);
  window.addEventListener("blur", hideTabTip);
}

/* ===== 标签拖动排序状态 ===== */
let dragTabId = null;
let dragOriginIndex = -1;
let dragDropped = false;
let lastTabsPayload = null;   // 拖动取消时用于还原；悬停提示也用它取完整文件名

function tabsArray() {
  return [...tabsEl.querySelectorAll(".tab")];
}

/**
 * 把被拖的标签移动到某个标签的前面/后面。
 * 用 FLIP 手法做滑动动画：换位前记录位置 → 换位后先用 transform 抵消位移 → 再过渡到 0。
 */
function moveDragTo(targetEl, before) {
  const dragEl = tabsEl.querySelector(".tab.dragging");
  if (!dragEl || !targetEl || dragEl === targetEl) return;

  // 记录换位前每个标签的位置
  const beforeRects = new Map();
  for (const t of tabsEl.querySelectorAll(".tab")) {
    beforeRects.set(t, t.getBoundingClientRect());
  }

  if (before) tabsEl.insertBefore(dragEl, targetEl);
  else tabsEl.insertBefore(dragEl, targetEl.nextSibling);

  // 让其它标签从旧位置"滑"到新位置
  for (const t of tabsEl.querySelectorAll(".tab")) {
    const prev = beforeRects.get(t);
    if (!prev) continue;                       // 新出现的元素不参与
    const now = t.getBoundingClientRect();
    const dx = prev.left - now.left;
    if (Math.abs(dx) < 0.5) continue;          // 没动，跳过

    t.style.transition = "none";
    t.style.transform = `translateX(${dx}px)`;
    void t.offsetWidth;                        // 强制 reflow，确保起始值生效
    t.style.transition = "transform .18s cubic-bezier(.22,.7,.3,1)";
    t.style.transform = "translateX(0)";

    clearTimeout(t.__slideTimer);
    t.__slideTimer = setTimeout(() => {
      t.style.transition = "";
      t.style.transform = "";
    }, 220);
  }
}

function isBeforeTarget(el, clientX) {
  const r = el.getBoundingClientRect();
  return clientX < r.left + r.width / 2;
}

function bindTabDrag(el) {
  el.addEventListener("dragstart", (e) => {
    dragTabId = Number(el.dataset.id);
    dragDropped = false;
    dragOriginIndex = tabsArray().indexOf(el);
    window.__mdTabDrag = true;
    document.body.classList.remove("dragging");
    // 延迟一帧再加样式，避免影响系统生成的拖动缩略图
    requestAnimationFrame(() => el.classList.add("dragging"));
    try {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(dragTabId));
    } catch (err) {}
  });

  el.addEventListener("dragend", () => {
    tabsEl.querySelectorAll(".tab").forEach((t) => {
      clearTimeout(t.__slideTimer);
      t.style.transition = "";
      t.style.transform = "";
    });
    const dragged = tabsEl.querySelector(".tab.dragging");
    if (dragged) dragged.classList.remove("dragging");
    window.__mdTabDrag = false;
    document.body.classList.remove("dragging");

    if (!dragDropped && dragTabId !== null) {
      // 拖动被取消（按 Esc / 拖到窗口外）：还原原来的顺序
      if (lastTabsPayload) renderTabs(lastTabsPayload.tabs, lastTabsPayload.activeId);
    }
    dragTabId = null;
    dragOriginIndex = -1;
    dragDropped = false;
  });

  // 拖到某个标签上：实时把它挪过去，形成"挤开"效果
  el.addEventListener("dragover", (e) => {
    if (dragTabId === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    moveDragTo(el, isBeforeTarget(el, e.clientX));
  });

  el.addEventListener("drop", (e) => {
    if (dragTabId === null) return;
    e.preventDefault();
    e.stopPropagation();
    moveDragTo(el, isBeforeTarget(el, e.clientX));

    const dragEl = tabsEl.querySelector(".tab.dragging");
    const toIndex = dragEl ? tabsArray().indexOf(dragEl) : -1;
    dragDropped = true;
    if (dragEl) dragEl.classList.remove("dragging");
    window.__mdTabDrag = false;
    document.body.classList.remove("dragging");
    if (toIndex > -1 && dragTabId !== null) APP.moveTab(dragTabId, toIndex);
    dragTabId = null;
    dragOriginIndex = -1;
  });
}

/** 拖到标签右侧空白处：挪到最后 */
function bindTabsAreaDrop() {
  if (!tabsEl || tabsEl.dataset.areaBound === "1") return;
  tabsEl.dataset.areaBound = "1";
  tabsEl.addEventListener("dragover", (e) => {
    if (dragTabId === null) return;
    e.preventDefault();
    const all = tabsArray().filter((t) => !t.classList.contains("dragging"));
    if (!all.length) return;
    const last = all[all.length - 1];
    if (e.clientX > last.getBoundingClientRect().right) moveDragTo(last, false);
  });
  tabsEl.addEventListener("drop", (e) => {
    if (dragTabId === null) return;
    e.preventDefault();
    const dragEl = tabsEl.querySelector(".tab.dragging");
    const toIndex = dragEl ? tabsArray().indexOf(dragEl) : -1;
    dragDropped = true;
    if (dragEl) dragEl.classList.remove("dragging");
    window.__mdTabDrag = false;
    document.body.classList.remove("dragging");
    if (toIndex > -1) APP.moveTab(dragTabId, toIndex);
    dragTabId = null;
  });
  bindTabsAreaDrop.bound = true;
}

function showEmptyState() {
  const viewer = document.getElementById("viewer");
  const empty = document.getElementById("empty");
  if (viewer) { viewer.hidden = true; viewer.innerHTML = ""; }
  if (empty) empty.hidden = false;
  document.title = "Simple Markdown";
}

function installAppMode() {
  if (!APP) return;

  // 顶栏按钮：新建标签页（打开文件） / 导出 PDF
  const openBtn = document.getElementById("btn-open");
  if (openBtn) openBtn.onclick = () => APP.openDialog();
  const newTabBtn = document.getElementById("btn-newtab");
  if (newTabBtn) newTabBtn.onclick = () => APP.openDialog();

  const openBtn2 = document.getElementById("btn-open2");
  if (openBtn2) openBtn2.onclick = () => APP.openDialog();

  const printBtn = document.getElementById("btn-print");
  if (printBtn) printBtn.onclick = () => APP.exportPdf();

  // 目录 / 主题
  const tocBtn = document.getElementById("btn-toc");
  const syncTocBtn = () => tocBtn.classList.toggle(
    "active", !document.documentElement.classList.contains("toc-hidden")
  );
  tocBtn.onclick = () => {
    document.documentElement.classList.toggle("toc-hidden");
    syncTocBtn();
  };
  syncTocBtn();

  const themeBtn = document.getElementById("btn-theme");
  themeBtn.onclick = () =>
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  APP.onToggleToc(() => tocBtn.click());
  APP.onToggleTheme(() => themeBtn.click());

  // 标签列表变化
  APP.onTabs(({ tabs, activeId }) => renderTabs(tabs, activeId));

  // 主进程推送文档：首次打开 / 切换标签 / 文件保存后自动刷新
  APP.onDoc(async (payload) => {
    if (!payload) { tabActiveId = null; showEmptyState(); return; }
    const switchingTab = payload.id !== tabActiveId;
    if (switchingTab) { try { closeFind(); } catch (e) {} }
    await renderMarkdown(payload.content, payload.name, { keepScroll: payload.keepScroll });
    if (payload.name) document.title = payload.name + " — Simple Markdown";
    // 切回某个标签时，恢复它上次的阅读位置
    if (switchingTab) {
      const saved = tabScrollMemory.get(payload.id) || 0;
      const sc = scroller();
      if (sc) sc.scrollTop = saved;
    }
  });

  // 拖拽文件进来即打开（含真实路径）；标签拖动时不动这套逻辑
  window.addEventListener("dragover", (e) => {
    if (window.__mdTabDrag) return;
    e.preventDefault();
    document.body.classList.add("dragging");
  });
  window.addEventListener("dragleave", () => {
    document.body.classList.remove("dragging");
  });
  window.addEventListener("drop", (e) => {
    if (window.__mdTabDrag) { document.body.classList.remove("dragging"); return; }
    e.preventDefault();
    document.body.classList.remove("dragging");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    const p = APP.pathForFile(f);
    if (p) APP.openPath(p);
  });

  // 粘贴 Markdown 文本直接预览（不出磁盘）
  // 说明：带输入框判断的处理在页面顶层已经注册过，这里不再重复注册，
  // 否则同一段文本会被渲染两次。

  bindFindEvents();
  APP.onFind(() => openFind());
  APP.onFindNext(() => findStep(1));
  APP.onFindPrev(() => findStep(-1));
  APP.ready();
}

/* ================= 启动 ================= */
(async function boot() {
  await loadLibs();
  installAppMode();
})();
</script>
